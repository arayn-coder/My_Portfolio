<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131c"/>
      <stop offset="50%" stop-color="#181a28"/>
      <stop offset="100%" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="avGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282d42"/>
      <stop offset="100%" stop-color="#181b2a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#avBg)"/>
  <rect width="600" height="600" rx="36" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Halo glow -->
  <circle cx="300" cy="260" r="220" fill="url(#halo)"/>

  <!-- Geometric rings -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1"/>

  <!-- Developer Silhouette Artwork -->
  <g transform="translate(150, 100)">
    <!-- Shoulders -->
    <path d="M 10 380 Q 50 260 150 250 Q 250 260 290 380 Z" fill="#1e2235"/>
    <path d="M 50 380 Q 90 280 150 270 Q 210 280 250 380 Z" fill="#141724"/>

    <!-- Neck -->
    <rect x="125" y="190" width="50" height="70" rx="10" fill="#22273d"/>

    <!-- Head / Jaw -->
    <path d="M 85 140 C 85 220 120 230 150 230 C 180 230 215 220 215 140 C 215 70 180 50 150 50 C 120 50 85 70 85 140 Z" fill="url(#faceGrad)"/>

    <!-- Hair / Sleek styled geometric cut -->
    <path d="M 75 110 C 75 40 120 15 150 15 C 190 15 225 35 225 90 C 210 75 185 70 150 70 C 120 70 95 85 75 110 Z" fill="#090b12"/>
    <path d="M 80 100 Q 150 40 220 75 Q 160 85 80 100 Z" fill="url(#avGlow)" opacity="0.4"/>

    <!-- Smart Glasses / Futuristic rim -->
    <g transform="translate(92, 105)">
      <!-- Left frame -->
      <rect x="0" y="0" width="52" height="32" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#6366f1" stroke-width="2.5"/>
      <line x1="10" y1="10" x2="42" y2="10" stroke="rgba(99, 102, 241, 0.6)" stroke-width="2"/>
      
      <!-- Bridge -->
      <line x1="52" y1="12" x2="64" y2="12" stroke="#6366f1" stroke-width="2.5"/>
      
      <!-- Right frame -->
      <rect x="64" y="0" width="52" height="32" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#6366f1" stroke-width="2.5"/>
      <line x1="74" y1="10" x2="106" y2="10" stroke="rgba(6, 182, 212, 0.6)" stroke-width="2"/>
    </g>

    <!-- Collar / Sleek dark turtleneck detail -->
    <path d="M 115 240 L 185 240 L 195 280 L 105 280 Z" fill="#0b0d14"/>
    <line x1="150" y1="240" x2="150" y2="280" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  </g>

  <!-- Floating Badge: Full-Stack -->
  <g transform="translate(60, 480)">
    <rect width="180" height="48" rx="24" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="7" fill="#6366f1"/>
    <text x="46" y="29" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Full-Stack Craft</text>
  </g>

  <!-- Floating Badge: Available -->
  <g transform="translate(360, 480)">
    <rect width="180" height="48" rx="24" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="5" fill="#22c55e"/>
    <text x="44" y="29" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600">Active Engineer</text>
  </g>
</svg>
