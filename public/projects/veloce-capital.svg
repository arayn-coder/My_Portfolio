<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="vcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#vcBg)"/>
  <circle cx="900" cy="200" r="280" fill="#f59e0b" opacity="0.08" filter="blur(90px)"/>

  <g transform="translate(60, 50)">
    <rect width="1080" height="650" rx="16" fill="#101015" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <rect width="1080" height="60" rx="16" fill="#171720"/>
    <rect y="44" width="1080" height="16" fill="#171720"/>
    <line x1="0" y1="60" x2="1080" y2="60" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <text x="50" y="38" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="700" letter-spacing="3">VELOCE CAPITAL</text>
    <text x="450" y="36" fill="#a1a1aa" font-family="sans-serif" font-size="12">PORTFOLIO</text>
    <text x="570" y="36" fill="#a1a1aa" font-family="sans-serif" font-size="12">THESIS</text>
    <text x="670" y="36" fill="#a1a1aa" font-family="sans-serif" font-size="12">LP PORTAL</text>

    <!-- Main Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="50" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3">GLOBAL VENTURE &amp; QUANTITATIVE GROWTH</text>
      <text x="0" y="110" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Capitalizing Next-Era</text>
      <text x="0" y="160" fill="url(#gold)" font-family="sans-serif" font-size="44" font-weight="700">Autonomous Infrastructure.</text>
      
      <text x="0" y="210" fill="#a1a1aa" font-family="sans-serif" font-size="14">
        $1.4B in assets under management across AI, computational biology, and planetary robotics.
      </text>

      <g transform="translate(0, 260)">
        <rect width="280" height="160" rx="12" fill="#161620" stroke="rgba(255,255,255,0.08)"/>
        <text x="25" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12">CUMULATIVE IRR</text>
        <text x="25" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700">38.4%</text>
        <text x="25" y="125" fill="#34d399" font-family="sans-serif" font-size="12">Top decile benchmark</text>
      </g>

      <g transform="translate(320, 260)">
        <rect width="280" height="160" rx="12" fill="#161620" stroke="rgba(255,255,255,0.08)"/>
        <text x="25" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12">TOTAL DEPLOYED</text>
        <text x="25" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700">$840M</text>
        <text x="25" y="125" fill="#fbbf24" font-family="sans-serif" font-size="12">32 Portfolio companies</text>
      </g>

      <g transform="translate(640, 260)">
        <rect width="320" height="160" rx="12" fill="#161620" stroke="rgba(255,255,255,0.08)"/>
        <text x="25" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12">ACTIVE EXITS</text>
        <text x="25" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700">11 IPOs / M&amp;A</text>
        <text x="25" y="125" fill="#60a5fa" font-family="sans-serif" font-size="12">Average 4.2x cash-on-cash</text>
      </g>
    </g>
  </g>
</svg>
