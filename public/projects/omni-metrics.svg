<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#111524"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 34, 53, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 18, 30, 0.9)"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Ambient light blobs -->
  <circle cx="950" cy="200" r="280" fill="#6366f1" opacity="0.15" filter="blur(70px)"/>
  <circle cx="250" cy="550" r="300" fill="#06b6d4" opacity="0.12" filter="blur(80px)"/>

  <!-- Window Chrome Container -->
  <g transform="translate(60, 50)">
    <!-- Main Window Background -->
    <rect width="1080" height="650" rx="16" fill="#0d111c" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect width="1080" height="48" rx="16" fill="#141828"/>
    <rect y="32" width="1080" height="16" fill="#141828"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#eab308" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e" opacity="0.8"/>
    
    <!-- Title / Breadcrumb -->
    <text x="540" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">OMNIMETRICS // CLOUD OBSERVABILITY ENGINE</text>
    
    <!-- Status Pill -->
    <rect x="940" y="14" width="110" height="22" rx="11" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <circle cx="955" cy="25" r="3.5" fill="#22c55e"/>
    <text x="965" y="29" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">HEALTHY</text>

    <!-- Sidebar Mock -->
    <rect x="0" y="48" width="80" height="602" fill="#0e1322" stroke-right="rgba(255, 255, 255, 0.05)"/>
    <rect x="25" y="80" width="30" height="30" rx="8" fill="url(#glow)"/>
    <circle cx="40" cy="150" r="10" fill="#334155"/>
    <circle cx="40" cy="200" r="10" fill="#38bdf8"/>
    <circle cx="40" cy="250" r="10" fill="#334155"/>
    <circle cx="40" cy="300" r="10" fill="#334155"/>

    <!-- Dashboard Content Area -->
    <g transform="translate(110, 75)">
      <!-- KPI Cards Row -->
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="215" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">REQUESTS / SEC</text>
        <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">54,820</text>
        <text x="20" y="92" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="600">+14.2% vs avg</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(245, 0)">
        <rect width="215" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">MEDIAN LATENCY</text>
        <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">18.4 ms</text>
        <text x="20" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">p99 = 42ms</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(490, 0)">
        <rect width="215" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">SUCCESS RATE</text>
        <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">99.98%</text>
        <text x="20" y="92" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="600">0 anomalies</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(735, 0)">
        <rect width="215" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">ACTIVE CLUSTERS</text>
        <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">14 Edge</text>
        <text x="20" y="92" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">Global routing</text>
      </g>

      <!-- Big Chart Section -->
      <g transform="translate(0, 135)">
        <rect width="950" height="250" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">Real-Time Ingestion Throughput</text>
        <text x="25" y="55" fill="#64748b" font-family="sans-serif" font-size="12">Telemetry stream telemetry-global-primary</text>

        <!-- Chart Grid Lines -->
        <line x1="25" y1="90" x2="925" y2="90" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
        <line x1="25" y1="140" x2="925" y2="140" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
        <line x1="25" y1="190" x2="925" y2="190" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>

        <!-- Chart Fill Gradient -->
        <path d="M 40 200 Q 140 180 240 130 T 440 110 T 640 150 T 840 70 L 910 80 L 910 220 L 40 220 Z" fill="url(#glow)" opacity="0.15"/>
        <!-- Chart Curve Line -->
        <path d="M 40 200 Q 140 180 240 130 T 440 110 T 640 150 T 840 70 L 910 80" fill="none" stroke="url(#accentLine)" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Active Data Point -->
        <circle cx="840" cy="70" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
        <rect x="790" y="25" width="100" height="30" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
        <text x="840" y="45" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">58.4k req/s</text>
      </g>

      <!-- Bottom Mini Logs Row -->
      <g transform="translate(0, 405)">
        <rect width="950" height="130" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="25" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Live Infrastructure Events</text>
        <rect x="25" y="50" width="8" height="8" rx="4" fill="#22c55e"/>
        <text x="45" y="58" fill="#94a3b8" font-family="monospace" font-size="11">[09:48:12] Auto-scaler spawned 4 edge instances in us-east-1 (Load target: 72%)</text>
        <rect x="25" y="75" width="8" height="8" rx="4" fill="#38bdf8"/>
        <text x="45" y="83" fill="#94a3b8" font-family="monospace" font-size="11">[09:48:04] AI Anomaly detector evaluated 120,000 metrics — Nominal variance</text>
        <rect x="25" y="100" width="8" height="8" rx="4" fill="#a855f7"/>
        <text x="45" y="108" fill="#94a3b8" font-family="monospace" font-size="11">[09:47:51] SSL certificate renewed for 16 edge hostnames without downtime</text>
      </g>
    </g>
  </g>
</svg>
