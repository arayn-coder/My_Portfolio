<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#040308"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#aiBg)"/>
  <circle cx="600" cy="300" r="320" fill="#8b5cf6" opacity="0.12" filter="blur(90px)"/>

  <g transform="translate(60, 50)">
    <rect width="1080" height="650" rx="16" fill="#110e20" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <rect width="1080" height="48" rx="16" fill="#17132c"/>
    <rect y="32" width="1080" height="16" fill="#17132c"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#eab308" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e" opacity="0.8"/>

    <text x="540" y="29" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">SYNTHETIX AI // PROMPT BENCHMARK CANVAS</text>

    <g transform="translate(40, 75)">
      <!-- Prompt input box -->
      <rect width="1000" height="120" rx="12" fill="#181430" stroke="rgba(255,255,255,0.08)"/>
      <text x="25" y="30" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="700">PROMPT TEMPLATE (v3.2)</text>
      <text x="25" y="60" fill="#e2e8f0" font-family="monospace" font-size="13">"Act as a distributed systems architect. Refactor the following consensus protocol to ensure linearizability..."</text>
      <rect x="850" y="70" width="125" height="34" rx="8" fill="url(#aiGlow)"/>
      <text x="912" y="92" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">RUN BENCHMARK</text>

      <!-- Side-by-side comparison columns -->
      <g transform="translate(0, 145)">
        <!-- Col 1 -->
        <rect width="485" height="400" rx="12" fill="#181430" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="35" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="700">CLAUDE 3.5 SONNET</text>
        <text x="320" y="35" fill="#94a3b8" font-family="monospace" font-size="11">Latency: 412ms • 312 Tok</text>
        <line x1="25" y1="55" x2="460" y2="55" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="85" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Replaced naive Raft commit loop with multi-paxos quorum.</text>
        <text x="25" y="115" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Added fencing tokens to avoid split-brain lock acquisition.</text>
        <text x="25" y="145" fill="#34d399" font-family="monospace" font-size="11">Score: 98.4% (TLA+ Model Checked)</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(515, 145)">
        <rect width="485" height="400" rx="12" fill="#181430" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="35" fill="#8b5cf6" font-family="sans-serif" font-size="13" font-weight="700">GPT-4o</text>
        <text x="320" y="35" fill="#94a3b8" font-family="monospace" font-size="11">Latency: 530ms • 348 Tok</text>
        <line x1="25" y1="55" x2="460" y2="55" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="85" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Implemented viewstamped replication with epoch leases.</text>
        <text x="25" y="115" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Identified edge case in uncommitted log truncation.</text>
        <text x="25" y="145" fill="#34d399" font-family="monospace" font-size="11">Score: 96.1% (Formal Verification Pass)</text>
      </g>
    </g>
  </g>
</svg>
