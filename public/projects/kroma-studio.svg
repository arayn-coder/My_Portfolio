<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="50%" stop-color="#141318"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#kbBg)"/>
  
  <!-- Subtle ambient aura -->
  <circle cx="600" cy="350" r="350" fill="#f43f5e" opacity="0.08" filter="blur(90px)"/>
  <circle cx="1000" cy="600" r="250" fill="#a855f7" opacity="0.1" filter="blur(80px)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="650" rx="16" fill="#111116" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Navbar inside mock -->
    <rect width="1080" height="60" rx="16" fill="#16161d"/>
    <rect y="44" width="1080" height="16" fill="#16161d"/>
    <line x1="0" y1="60" x2="1080" y2="60" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Logo / Brand -->
    <text x="50" y="38" fill="#ffffff" font-family="'Didot', 'Playfair Display', Georgia, serif" font-size="20" font-weight="700" letter-spacing="4">KROMA</text>
    <text x="145" y="38" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2">STUDIO</text>

    <!-- Mock Nav Links -->
    <text x="450" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="12" letter-spacing="1">COLLECTIONS</text>
    <text x="570" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="1">LOOKBOOK</text>
    <text x="680" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="1">ARCHIVE</text>

    <!-- Cart Button -->
    <rect x="960" y="16" width="80" height="28" rx="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="1000" y="34" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">BAG (02)</text>

    <!-- Main Editorial Hero Layout -->
    <g transform="translate(50, 90)">
      <!-- Left Editorial Column -->
      <text x="0" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3">SPRING / SUMMER '25</text>
      <text x="0" y="110" fill="#ffffff" font-family="'Didot', Georgia, serif" font-size="52" font-weight="400" letter-spacing="-1">The Kinetic</text>
      <text x="0" y="170" fill="url(#warmGlow)" font-family="'Didot', Georgia, serif" font-size="52" font-style="italic">Monolith Series</text>
      
      <text x="0" y="225" fill="#a1a1aa" font-family="sans-serif" font-size="14" width="380">
        Sculptural aesthetics fused with modern functionalism.
      </text>
      <text x="0" y="250" fill="#71717a" font-family="sans-serif" font-size="13">
        Tailored silhouettes engineered for seamless movement.
      </text>

      <!-- CTA Button -->
      <rect x="0" y="290" width="160" height="44" rx="22" fill="#ffffff"/>
      <text x="80" y="317" fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">EXPLORE CAPSULE</text>

      <!-- Product Cards Right Side -->
      <!-- Card 1 -->
      <g transform="translate(420, 20)">
        <rect width="250" height="370" rx="12" fill="#181822" stroke="rgba(255,255,255,0.08)"/>
        <!-- Abstract garment silhouette -->
        <rect x="25" y="25" width="200" height="230" rx="8" fill="#242434"/>
        <path d="M 65 60 L 185 60 L 205 130 L 165 140 L 175 235 L 75 235 L 85 140 L 45 130 Z" fill="url(#warmGlow)" opacity="0.65"/>
        <text x="25" y="285" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Obsidian Draped Parka</text>
        <text x="25" y="308" fill="#a1a1aa" font-family="sans-serif" font-size="12">Recycled Tech-Nylon</text>
        <text x="25" y="338" fill="url(#goldAcc)" font-family="sans-serif" font-size="15" font-weight="700">$580.00</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(700, 20)">
        <rect width="250" height="370" rx="12" fill="#181822" stroke="rgba(255,255,255,0.08)"/>
        <!-- Abstract item silhouette -->
        <rect x="25" y="25" width="200" height="230" rx="8" fill="#242434"/>
        <circle cx="125" cy="140" r="70" fill="url(#warmGlow)" opacity="0.5"/>
        <rect x="65" y="110" width="120" height="60" rx="8" fill="#111116" stroke="rgba(255,255,255,0.3)"/>
        <text x="25" y="285" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Prism Structural Bag</text>
        <text x="25" y="308" fill="#a1a1aa" font-family="sans-serif" font-size="12">Anodized Titanium Frame</text>
        <text x="25" y="338" fill="url(#goldAcc)" font-family="sans-serif" font-size="15" font-weight="700">$420.00</text>
      </g>

      <!-- Editorial Bottom Ticker -->
      <g transform="translate(0, 430)">
        <line x1="0" y1="0" x2="980" y2="0" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="35" fill="#71717a" font-family="sans-serif" font-size="11" letter-spacing="2">FEATURED IN VOGUE DIGITAL // AWWWARDS SITE OF THE DAY // 99 LIGHTHOUSE SPEED</text>
      </g>
    </g>
  </g>
</svg>
