<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="nfGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#nfBg)"/>
  <circle cx="800" cy="300" r="300" fill="#10b981" opacity="0.09" filter="blur(90px)"/>
  <circle cx="300" cy="500" r="280" fill="#06b6d4" opacity="0.08" filter="blur(80px)"/>

  <g transform="translate(60, 50)">
    <rect width="1080" height="650" rx="16" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Top Tab bar -->
    <rect width="1080" height="44" rx="16" fill="#131722"/>
    <rect y="28" width="1080" height="16" fill="#131722"/>
    <line x1="0" y1="44" x2="1080" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window buttons -->
    <circle cx="28" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="22" r="6" fill="#eab308" opacity="0.8"/>
    <circle cx="68" cy="22" r="6" fill="#22c55e" opacity="0.8"/>

    <!-- Active Tab -->
    <rect x="110" y="8" width="220" height="36" rx="8" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <rect x="125" y="18" width="40" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="145" y="30" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">POST</text>
    <text x="175" y="30" fill="#f1f5f9" font-family="monospace" font-size="12">/api/v2/deploy</text>

    <!-- Address Bar -->
    <g transform="translate(40, 65)">
      <rect width="1000" height="46" rx="10" fill="#161b26" stroke="rgba(255,255,255,0.08)"/>
      <rect x="12" y="10" width="70" height="26" rx="6" fill="#10b981"/>
      <text x="47" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">POST</text>
      <text x="100" y="28" fill="#e2e8f0" font-family="monospace" font-size="13">https://mesh.infra.dev/clusters/us-east-1/orchestrate</text>
      
      <rect x="880" y="8" width="108" height="30" rx="8" fill="#3b82f6"/>
      <text x="934" y="27" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SEND ▶</text>
    </g>

    <!-- Split Screen (Request Body / Response) -->
    <g transform="translate(40, 130)">
      <!-- Left Panel: Payload -->
      <rect width="485" height="470" rx="12" fill="#121622" stroke="rgba(255,255,255,0.06)"/>
      <rect width="485" height="36" rx="12" fill="#181d2c"/>
      <rect y="24" width="485" height="12" fill="#181d2c"/>
      <text x="20" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">JSON PAYLOAD</text>

      <!-- Code lines -->
      <g transform="translate(20, 60)" font-family="monospace" font-size="12">
        <text x="0" y="20" fill="#94a3b8">1  <tspan fill="#e2e8f0">{</tspan></text>
        <text x="0" y="45" fill="#94a3b8">2    <tspan fill="#38bdf8">"cluster"</tspan>: <tspan fill="#a78bfa">"alpha-titan"</tspan>,</text>
        <text x="0" y="70" fill="#94a3b8">3    <tspan fill="#38bdf8">"replicas"</tspan>: <tspan fill="#fbbf24">8</tspan>,</text>
        <text x="0" y="95" fill="#94a3b8">4    <tspan fill="#38bdf8">"zeroDowntime"</tspan>: <tspan fill="#34d399">true</tspan>,</text>
        <text x="0" y="120" fill="#94a3b8">5    <tspan fill="#38bdf8">"autoRollback"</tspan>: <tspan fill="#34d399">true</tspan>,</text>
        <text x="0" y="145" fill="#94a3b8">6    <tspan fill="#38bdf8">"healthCheck"</tspan>: {</text>
        <text x="0" y="170" fill="#94a3b8">7      <tspan fill="#38bdf8">"path"</tspan>: <tspan fill="#a78bfa">"/healthz"</tspan>,</text>
        <text x="0" y="195" fill="#94a3b8">8      <tspan fill="#38bdf8">"intervalMs"</tspan>: <tspan fill="#fbbf24">1500</tspan></text>
        <text x="0" y="220" fill="#94a3b8">9    }</text>
        <text x="0" y="245" fill="#94a3b8">10 <tspan fill="#e2e8f0">}</tspan></text>
      </g>

      <!-- Right Panel: Response & Schema -->
      <g transform="translate(515, 0)">
        <rect width="485" height="470" rx="12" fill="#121622" stroke="rgba(255,255,255,0.06)"/>
        <rect width="485" height="36" rx="12" fill="#181d2c"/>
        <rect y="24" width="485" height="12" fill="#181d2c"/>
        
        <text x="20" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">RESPONSE (200 OK)</text>
        <rect x="360" y="8" width="105" height="20" rx="10" fill="rgba(34, 197, 94, 0.2)"/>
        <text x="412" y="22" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">200 OK • 18ms</text>

        <g transform="translate(20, 60)" font-family="monospace" font-size="12">
          <text x="0" y="20" fill="#94a3b8">1  <tspan fill="#e2e8f0">{</tspan></text>
          <text x="0" y="45" fill="#94a3b8">2    <tspan fill="#38bdf8">"status"</tspan>: <tspan fill="#a78bfa">"deployed"</tspan>,</text>
          <text x="0" y="70" fill="#94a3b8">3    <tspan fill="#38bdf8">"deploymentId"</tspan>: <tspan fill="#a78bfa">"dep_98a72b3c"</tspan>,</text>
          <text x="0" y="95" fill="#94a3b8">4    <tspan fill="#38bdf8">"healthyPods"</tspan>: <tspan fill="#fbbf24">8</tspan>,</text>
          <text x="0" y="120" fill="#94a3b8">5    <tspan fill="#38bdf8">"ingressRoute"</tspan>: <tspan fill="#a78bfa">"edge.mesh.infra"</tspan>,</text>
          <text x="0" y="145" fill="#94a3b8">6    <tspan fill="#38bdf8">"certificatesValidUntil"</tspan>: <tspan fill="#a78bfa">"2027-01-01"</tspan></text>
          <text x="0" y="170" fill="#94a3b8">7  <tspan fill="#e2e8f0">}</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>
